name: PedPsy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:architecture
      - run: npm run check:dependencies
      - run: npm run check:syntax
      - run: npm run typecheck
      - run: npm test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan repository history with redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact=100 --verbose --no-banner .'

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [test, dependencies, secrets, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      TEST_RESULT: ${{ needs.test.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
      SECRET_RESULT: ${{ needs.secrets.result }}
      POSTGRES_RESULT: ${{ needs.postgres.result }}
    steps:
      - name: Fail if any required job failed or was skipped
        shell: bash
        run: |
          test "$TEST_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$SECRET_RESULT" = success
          test "$POSTGRES_RESULT" = success

  postgres:
    name: PostgreSQL 18 isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # Disposable synthetic job; never deploy this setting.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:pg
        env:
          PEDPSY_PG_TEST: '1'
          PGTEST_HOST: 127.0.0.1
          PGTEST_PORT: '5432'
          PGTEST_CONTAINER: ${{ job.services.postgres.id }}
