name: Selectel UI CD

# Never runs on PR code. A successful CI run for the actual main HEAD is required.
on:
  workflow_run:
    workflows: ["PedPsy CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "check = audit only; deploy = CSS-only if configured"
        required: true
        default: check
        options: [check, deploy]

permissions:
  contents: read
  actions: read

concurrency:
  group: selectel-ui-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact main and green CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Check live main, protection and exact SHA CI
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          url="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api() { curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$url/$1"; }
          branch="$(api branches/main)"
          actual="$(jq -r '.commit.sha' <<<"$branch")"
          protected="$(jq -r '.protected' <<<"$branch")"
          [[ "$actual" = "$TARGET_SHA" ]] || { echo "::error::main moved after CI; wait for CI on new SHA"; exit 1; }
          [[ "$protected" = true ]] || { echo "::error::main is not protected; configure GitHub branch rules"; exit 1; }
          runs="$(api 'actions/runs?branch=main&per_page=30')"
          jq -e --arg sha "$TARGET_SHA" '.workflow_runs | any(.[]; .name=="PedPsy CI" and .event=="push" and .head_sha==$sha and .conclusion=="success")' <<<"$runs" >/dev/null || {
            echo "::error::No successful main push CI on the exact target SHA"; exit 1;
          }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified protected main and successful CI at $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish CSS-only to Selectel (opt-in)
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      vars.SELECTEL_UI_AUTODEPLOY == 'true' &&
      (github.event_name == 'workflow_run' || inputs.mode == 'deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: selectel-ui
      url: https://mettest.vibemind.pro/workspace
    env:
      SELECTEL_HOST: ${{ vars.SELECTEL_UI_HOST }}
      SELECTEL_USER: ${{ vars.SELECTEL_UI_USER }}
      SELECTEL_PORT: ${{ vars.SELECTEL_UI_PORT }}
      SELECTEL_APP_ROOT: ${{ vars.SELECTEL_UI_APP_ROOT }}
      SELECTEL_SERVICE: ${{ vars.SELECTEL_UI_SERVICE }}
      DEPLOY_KEY: ${{ secrets.SELECTEL_UI_SSH_KEY }}
      PINNED_HOST_KEY: ${{ secrets.SELECTEL_UI_KNOWN_HOSTS }}
      TARGET_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pinned SSH identity without leaking private keys
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" && -n "$PINNED_HOST_KEY" ]] || { echo "::error::SSH deployment secrets missing"; exit 1; }
          [[ "$SELECTEL_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 2
          [[ "$SELECTEL_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || exit 2
          [[ "$SELECTEL_APP_ROOT" =~ ^/opt/[A-Za-z0-9_./-]+$ && "$SELECTEL_APP_ROOT" != *..* && "$SELECTEL_APP_ROOT" != *//* ]] || exit 2
          [[ "$SELECTEL_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]] || exit 2
          SELECTEL_PORT="${SELECTEL_PORT:-22}"
          [[ "$SELECTEL_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/selectel-ui-key"
          printf '%s\n' "$PINNED_HOST_KEY" > "$RUNNER_TEMP/selectel-ui-known-hosts"
          chmod 600 "$RUNNER_TEMP/selectel-ui-key" "$RUNNER_TEMP/selectel-ui-known-hosts"
          {
            echo "PORT=$SELECTEL_PORT"
            echo "KEY=$RUNNER_TEMP/selectel-ui-key"
            echo "HOSTS=$RUNNER_TEMP/selectel-ui-known-hosts"
          } >> "$GITHUB_ENV"
      - name: Check remote deployed SHA and diff from the real live release
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS" -i "$KEY" -p "$PORT")
          destination="$SELECTEL_USER@$SELECTEL_HOST"
          status="$(ssh "${ssh_args[@]}" "$destination" "bash -s -- status '$SELECTEL_APP_ROOT' '$SELECTEL_SERVICE'" < scripts/selectel-ui-remote.sh)"
          base="$(sed -n 's/^deployed_sha=//p' <<<"$status")"
          echo "Remote version: $base"
          [[ "$base" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Deployment marker missing, run one-time bootstrap"; exit 1; }
          # GitHub-side verification is repeated before even uploading the candidate.
          latest="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')"
          [[ "$latest" = "$TARGET_SHA" ]] || { echo "::error::main moved during the deployment"; exit 1; }
          node scripts/selectel-ui-cd-check.mjs "$base" "$TARGET_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "CSS-only changes verified against the actual deployed version" >> "$GITHUB_STEP_SUMMARY"
      - name: Install, restart, verify public site and rollback on failure
        shell: bash
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          OLD_HASH: ${{ steps.plan.outputs.old_css_sha }}
          NEW_HASH: ${{ steps.plan.outputs.new_css_sha }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS" -i "$KEY" -p "$PORT")
          scp_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS" -i "$KEY" -P "$PORT")
          destination="$SELECTEL_USER@$SELECTEL_HOST"
          remote_stage="$(ssh "${ssh_args[@]}" "$destination" "mktemp -d /tmp/mettest-ui-cd.XXXXXXXXXX")"
          [[ "$remote_stage" =~ ^/tmp/mettest-ui-cd\.[A-Za-z0-9]+$ ]] || exit 2
          trap 'ssh "${ssh_args[@]}" "$destination" "rm -f \'$remote_stage/styles.css\'; rmdir \'$remote_stage\'" || true' EXIT
          scp "${scp_args[@]}" web/workspace/styles.css "$destination:$remote_stage/styles.css"
          ssh "${ssh_args[@]}" "$destination" "bash -s -- apply '$SELECTEL_APP_ROOT' '$SELECTEL_SERVICE' '$BASE_SHA' '$TARGET_SHA' '$OLD_HASH' '$NEW_HASH' '$remote_stage'" < scripts/selectel-ui-remote.sh
          {
            echo "### Selectel UI deployed successfully"
            echo "Previous: \`$BASE_SHA\`"
            echo "Current: \`$TARGET_SHA\`"
            echo "Published CSS SHA256: \`$NEW_HASH\`"
            echo "Website: https://mettest.vibemind.pro/workspace"
            echo "Only CSS changed. No production database migration or backend deployment."
          } >> "$GITHUB_STEP_SUMMARY"
